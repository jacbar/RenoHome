# Worktrunk project hooks (https://worktrunk.dev)
# Shared file list: .worktreeinclude (also used by .cursor/setup-worktree-*.{sh,ps1})

[pre-start]
# Share gitignored local files listed in .worktreeinclude into the new worktree
env = "wt step copy-ignored --require-include"
# Restore NuGet packages so build/test work immediately
restore = "dotnet restore RenoHome.sln"

[pre-merge]
test = "dotnet test RenoHome.sln --configuration Release --verbosity minimal"
